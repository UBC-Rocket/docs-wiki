# UBC Rocket Wiki - Wiki.js 3 + PostgreSQL 18 + Caddy (automatic HTTPS)
# Runs on Oracle A1.Flex (ARM) or x86. Wiki.js 3 needs at least 1 GB RAM.
# Copy .env.example to .env, fill it in, then:  docker compose up -d

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    # Modest tuning; plenty for a team wiki on a 6-12 GB A1 instance.
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>/
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: { driver: local }

  wiki:
    # Major-version tag: gets 3.x fixes on `docker compose pull`. (3.x has no `latest` tag.)
    image: ghcr.io/requarks/wiki:3
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Only used to create the first admin account; no effect afterwards.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${DB_PASS}
      DB_NAME: wiki
    expose: ["3000"]
    restart: unless-stopped
    logging: { driver: local }

  caddy:
    image: caddy:2
    depends_on: [wiki]
    environment:
      WIKI_DOMAIN: ${WIKI_DOMAIN:?set WIKI_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: { driver: local }

volumes:
  db-data: {}
  caddy-data: {}
  caddy-config: {}
